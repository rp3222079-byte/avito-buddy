services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: avito_buddy
      POSTGRES_USER: avito
      POSTGRES_PASSWORD: avito
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avito -d avito_buddy"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  chromadb:
    image: chromadb/chroma:1.5.9
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8002:8000"
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/8000'"]
      interval: 5s
      timeout: 5s
      retries: 30

  rag-service:
    build:
      context: .
      dockerfile: rag-service/Dockerfile
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      KNOWLEDGE_BASE_PATH: /knowledge_base
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_CACHE_DIR: /models/fastembed
      RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD:-0.72}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-dev-internal-token}
    ports:
      - "8001:8001"
    volumes:
      - ./knowledge_base:/knowledge_base:ro
      - embedding_models:/models
    depends_on:
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1/}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      RAG_BASE_URL: http://rag-service:8001
      BACKEND_BASE_URL: http://backend:8080
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Novosibirsk}
      DEMO_USER_ID: ${DEMO_USER_ID:-intern_ivan}
      DEMO_USER_ROLE: ${DEMO_USER_ROLE:-intern}
      SYSTEM_PROMPT_PATH: /app/system_prompt.txt
      TOOLS_SCHEMA_PATH: /app/tools_schema.json
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-dev-internal-token}
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rag-service:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_URL: postgres://avito:***@postgres:5432/avito_buddy?sslmode=disable
      REDIS_ADDRESS: redis:6379
      MOCK_JIRA_PATH: /data/mock_jira.json
      MOCK_MENTOR_PATH: /data/mock_mentor.json
      AI_BASE_URL: ${AI_BASE_URL:-http://ai-service:8000}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-dev-internal-token}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      REQUEST_CONTEXT_SECRET: ${REQUEST_CONTEXT_SECRET:-}
      DEMO_MODE: ${DEMO_MODE:-true}
      PENDING_ACTION_TTL: ${PENDING_ACTION_TTL:-10m}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  embedding_models:
